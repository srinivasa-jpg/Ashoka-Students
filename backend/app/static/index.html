<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Notes AI</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="container"><header><span class="badge">Ashoka Students</span><h1>Smart Notes AI</h1><p>Turn long study notes into a quick summary and key points.</p></header><section class="card"><label for="notes">Paste your notes</label><textarea id="notes" placeholder="Paste your study notes here..."></textarea><div class="actions"><button id="summarize">Summarize Notes</button><span>or</span><label class="upload">Upload PDF/TXT<input id="file" type="file" accept=".pdf,.txt"></label></div><p id="status"></p></section><section id="result" class="card hidden"><h2>Summary</h2><p id="summary"></p><h2>Key Points</h2><ul id="points"></ul></section></main><script>const s=document.getElementById("status"),r=document.getElementById("result");function show(d){document.getElementById("summary").textContent=d.summary;const u=document.getElementById("points");u.innerHTML="";d.key_points.forEach(p=>{const l=document.createElement("li");l.textContent=p;u.appendChild(l)});r.classList.remove("hidden");s.textContent="Done."}async function req(url,o){s.textContent="Summarizing...";r.classList.add("hidden");try{const x=await fetch(url,o),d=await x.json();if(!x.ok)throw new Error(d.detail||"Something went wrong");show(d)}catch(e){s.textContent=e.message}}document.getElementById("summarize").onclick=()=>req("/summarize",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:document.getElementById("notes").value})});document.getElementById("file").onchange=e=>{if(!e.target.files[0])return;const f=new FormData();f.append("file",e.target.files[0]);req("/upload",{method:"POST",body:f})};</script></body></html>
